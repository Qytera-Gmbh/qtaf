# Run tests with different Java versions to check if our software works.
name: Test Java Versions

on:
  push:
    branches:
      - develop
    paths:
      - qtaf-*/**
      - pom.xml
  pull_request:
    branches:
      - develop

jobs:
  test-java-versions:
    strategy:
      matrix:
        # Java 17 LTS only. Java 19 was non-LTS and reached EOL — dropped 2026-06
        # to align with Maintenance-Mode reactivation. Re-add Java 21 LTS as
        # follow-up once Lombok 1.18.34+ is in (PR#337).
        JAVA_VERSION: ["17"]
        JAVA_DISTRIBUTION: [zulu]
    uses: ./.github/workflows/Test.yml
    with:
      java-version: ${{ matrix.JAVA_VERSION }}
      java-distribution: ${{ matrix.JAVA_DISTRIBUTION }}
    secrets: inherit
